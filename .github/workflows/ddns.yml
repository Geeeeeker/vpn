name: Build ngrok with Custom SSL Certificates

on:
  workflow_dispatch:
    inputs:
      domains:
        description: '域名列表，多个用逗号分隔（例如：txddns.dynv6.net,web.txddns.dynv6.net）'
        required: true
        default: 'txddns.dynv6.net'
      token:
        description: 'Dynv6 API Token'
        required: true
  schedule:
    # 每 80 天自动运行一次（Let's Encrypt 证书有效期 90 天）
    - cron: '0 0 */80 * *'

permissions:
  contents: write
  packages: write

jobs:
  # 第一步：申请 SSL 证书
  issue-certs:
    runs-on: ubuntu-latest
    outputs:
      cert_domain: ${{ steps.set-domain.outputs.first_domain }}
    steps:
      - name: 安装 acme.sh
        run: |
          curl https://get.acme.sh | sh -s email=your-email@example.com
          echo "$HOME/.acme.sh" >> $GITHUB_PATH

      - name: 设置 Dynv6 Token 环境变量
        run: |
          echo "DYNV6_TOKEN=${{ inputs.token || secrets.DYNV6_TOKEN }}" >> $GITHUB_ENV

      - name: 为每个域名申请证书
        id: certs
        run: |
          IFS=',' read -ra DOMAINS <<< "${{ inputs.domains }}"
          
          mkdir -p ./certs_output
          
          for domain in "${DOMAINS[@]}"; do
            echo "正在处理域名: $domain"
            
            # 申请证书
            $HOME/.acme.sh/acme.sh --issue --dns dns_dynv6 -d "$domain" \
              --server letsencrypt
            
            # 安装证书（使用 ngrok 需要的命名）
            $HOME/.acme.sh/acme.sh --install-cert -d "$domain" \
              --cert-file "./certs_output/device.crt" \
              --key-file "./certs_output/device.key" \
              --ca-file "./certs_output/rootCA.pem" \
              --fullchain-file "./certs_output/fullchain.pem"
            
            # 只取第一个域名作为主要域名
            break
          done
          
          echo "证书文件列表:"
          ls -la ./certs_output/

      - name: 设置第一个域名作为输出
        id: set-domain
        run: |
          IFS=',' read -ra DOMAINS <<< "${{ inputs.domains }}"
          echo "first_domain=${DOMAINS[0]}" >> $GITHUB_OUTPUT

      - name: 上传证书作为构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ssl-certificates
          path: ./certs_output/
          retention-days: 1

  # 第二步：编译 ngrok 并打包发布
  build-and-release:
    needs: issue-certs
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # Linux 系列 - 打包为 deb
          - os: linux
            arch: amd64
            goarch: amd64
            goos: linux
            package_type: deb
          - os: linux
            arch: arm64
            goarch: arm64
            goos: linux
            package_type: deb
          # macOS 系列 - 打包为 zip
          - os: darwin
            arch: amd64
            goarch: amd64
            goos: darwin
            package_type: zip
          # Windows 系列 - 打包为 zip
          - os: windows
            arch: amd64
            goarch: amd64
            goos: windows
            package_type: zip
          - os: windows
            arch: arm64
            goarch: arm64
            goos: windows
            package_type: zip

    steps:
      - name: Checkout ngrok v1 源码
        uses: actions/checkout@v3
        with:
          repository: inconshreveable/ngrok
          fetch-depth: 0

      - name: 下载 SSL 证书
        uses: actions/download-artifact@v4
        with:
          name: ssl-certificates
          path: ./certs

      - name: 设置 Go
        uses: actions/setup-go@v3
        with:
          go-version: '1.24.x'

      - name: 执行证书替换和域名配置
        run: |
          # 删除默认证书
          rm -f assets/client/tls/ngrokroot.crt
          rm -f assets/server/tls/snakeoil.crt
          rm -f assets/server/tls/snakeoil.key
          
          # 重命名并复制证书
          cp ./certs/device.crt assets/server/tls/snakeoil.crt
          cp ./certs/device.key assets/server/tls/snakeoil.key
          cp ./certs/rootCA.pem assets/client/tls/ngrokroot.crt
          
          # 设置域名
          echo "NGROK_DOMAIN=${{ needs.issue-certs.outputs.cert_domain }}" >> $GITHUB_ENV
          
          echo "证书替换完成，域名设置为: ${{ needs.issue-certs.outputs.cert_domain }}"

      - name: 编译 ngrok (${{ matrix.os }}-${{ matrix.arch }})
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          if [ "${{ matrix.package_type }}" = "deb" ]; then
            # Linux 编译服务端和客户端
            make release-server
            make release-client
          else
            # 其他平台只编译客户端
            make release-client
          fi

      - name: 获取版本号
        id: version
        run: |
          # 使用日期作为版本号，格式：v2026.05.02-120000
          VERSION="v$(date +'%Y.%m.%d-%H%M%S')"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version=$VERSION"

      - name: 打包 Linux deb 包
        if: matrix.package_type == 'deb'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ARCH="${{ matrix.arch }}"
          PKG_NAME="ngrok"
          PKG_VER="${VERSION#v}"
          
          # 创建 deb 包目录结构
          DEB_DIR="deb-pkg"
          mkdir -p $DEB_DIR/DEBIAN
          mkdir -p $DEB_DIR/usr/bin
          mkdir -p $DEB_DIR/usr/share/doc/ngrok
          
          # 复制二进制文件
          cp bin/ngrok $DEB_DIR/usr/bin/
          cp bin/ngrokd $DEB_DIR/usr/bin/ 2>/dev/null || true
          
          # 创建 control 文件
          cat > $DEB_DIR/DEBIAN/control << EOF
          Package: ngrok
          Version: $PKG_VER
          Architecture: $ARCH
          Maintainer: Your Name <your-email@example.com>
          Description: ngrok - Introspected tunnels to localhost
           Custom build with Dynv6 SSL certificates for ${{ needs.issue-certs.outputs.cert_domain }}
          EOF
          
          # 构建 deb 包
          dpkg-deb --build $DEB_DIR
          mv $DEB_DIR.deb "ngrok_${PKG_VER}_${ARCH}.deb"
          
          echo "Generated: ngrok_${PKG_VER}_${ARCH}.deb"

      - name: 打包 macOS/Windows zip 包
        if: matrix.package_type == 'zip'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          OS="${{ matrix.os }}"
          ARCH="${{ matrix.arch }}"
          
          # 创建打包目录
          PKG_DIR="ngrok-${OS}-${ARCH}"
          mkdir -p $PKG_DIR
          
          # 复制二进制文件
          cp bin/ngrok* $PKG_DIR/ 2>/dev/null || true
          # Windows 可执行文件后缀处理
          if [ "$OS" = "windows" ]; then
            for f in $PKG_DIR/ngrok*; do
              mv "$f" "${f}.exe" 2>/dev/null || true
            done
          fi
          
          # 创建说明文件
          cat > $PKG_DIR/README.txt << EOF
          ngrok Custom Build
          Version: $VERSION
          Platform: $OS / $ARCH
          Domain: ${{ needs.issue-certs.outputs.cert_domain }}
          Build Date: $(date)
          EOF
          
          # 打包
          zip -r "ngrok_${VERSION}_${OS}_${ARCH}.zip" $PKG_DIR
          
          echo "Generated: ngrok_${VERSION}_${OS}_${ARCH}.zip"

      - name: 上传单个构架产物
        uses: actions/upload-artifact@v4
        with:
          name: ngrok-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            ngrok_*_${{ matrix.arch }}.deb
            ngrok_*_${{ matrix.os }}_${{ matrix.arch }}.zip
          retention-days: 1

  # 第三步：创建 Release 并上传所有文件
  release:
    needs: build-and-release
    runs-on: ubuntu-latest
    steps:
      - name: 获取版本号
        id: version
        run: |
          VERSION="v$(date +'%Y.%m.%d-%H%M%S')"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: 下载所有构架产物
        uses: actions/download-artifact@v4
        with:
          path: ./release-assets

      - name: 整理 Release 文件
        run: |
          mkdir -p ./release-files
          find ./release-assets -type f \( -name "*.deb" -o -name "*.zip" \) -exec cp {} ./release-files/ \;
          echo "Release files:"
          ls -la ./release-files/

      - name: 创建 Release 并上传文件
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ngrok Custom Build ${{ steps.version.outputs.version }}
          body: |
            ## ngrok v1 自定义编译版本
            
            **域名**: ${{ needs.issue-certs.outputs.cert_domain }}
            **构建时间**: $(date)
            **证书类型**: Let's Encrypt (Dynv6 DNS 验证)
            
            ### 包含的文件
            
            #### Linux (deb 包)
            - `ngrok_*_amd64.deb` - x86_64 架构
            - `ngrok_*_arm64.deb` - ARM64 架构
            
            #### macOS (zip 包)
            - `ngrok_*_darwin_amd64.zip` - Intel 处理器
            
            #### Windows (zip 包)
            - `ngrok_*_windows_amd64.zip` - x64 架构
            - `ngrok_*_windows_arm64.zip` - ARM64 架构
            
            ### 使用说明
            1. 下载对应平台的压缩包
            2. 解压后直接运行 `ngrok` 即可
            3. 证书已内置，域名 ${{ needs.issue-certs.outputs.cert_domain }} 的隧道会自动使用 HTTPS
            
            ### 注意事项
            - 证书有效期为 90 天，此构建每 80 天自动更新一次
            - 此构建基于 ngrok v1，支持自托管服务端和客户端
          files: ./release-files/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
